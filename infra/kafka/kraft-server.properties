# ============================================================================
# Local single-node Kafka broker in KRaft mode (Day 7)
# ============================================================================
# Template, NOT used directly: `infra/kafka/kafka.ps1` substitutes the __XXX__
# placeholders and writes the result into the Kafka installation. Placeholders
# are used because Kafka (a JVM process reading plain properties) has no notion
# of environment variables, and hard-coding one developer's paths into the repo
# would be worse.
#
# Deliberately minimal - this is a DEVELOPMENT broker:
#   * KRaft, no ZooKeeper: one process, one config, no second quorum to run
#     (the ZooKeeper-based path is legacy and being removed from Kafka itself)
#   * one node, one replica: replication exists to survive broker failure, and
#     in development the broker's failure mode is "you stopped it"
#   * PLAINTEXT: no TLS/SASL. Real clusters need both; a local dev broker with
#     self-signed certs is friction that teaches nothing about event design.
#
# NOT included on purpose (docs/KAFKA.md §2): Schema Registry, Kafka Connect,
# Kafka Streams, multiple brokers, Kubernetes, cloud Kafka.
# ============================================================================

############################# Node / roles #############################
# Combined broker+controller: this one process both stores data and manages
# cluster metadata. Splitting the roles only matters at real scale.
process.roles=broker,controller
node.id=1

# The controller quorum. Single voter, so `min.insync.replicas` style majority
# logic can never block startup.
controller.quorum.voters=1@127.0.0.1:__CONTROLLER_PORT__
controller.listener.names=CONTROLLER

############################# Listeners #############################
listeners=PLAINTEXT://127.0.0.1:__PORT__,CONTROLLER://127.0.0.1:__CONTROLLER_PORT__
# Advertised addresses are what CLIENTS are told to reconnect to. Binding to
# 127.0.0.1 while advertising `localhost` is the classic cause of
# "connection to node -1 could not be established"; keep both numeric.
advertised.listeners=PLAINTEXT://127.0.0.1:__PORT__
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

############################# Storage #############################
log.dirs=__LOG_DIRS__
num.partitions=3
num.recovery.threads.per.data.dir=1

# Internal topics are the cluster's own bookkeeping; one replica because there
# is one broker (a higher factor would make the broker refuse to start).
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
default.replication.factor=1

# Topics are DECLARED by the application (topics.ts + ensureTopics()), never
# conjured by the first message. With auto-creation on, a typo in a topic name
# silently creates a real topic with default settings that nothing consumes -
# the kind of bug that is invisible until you wonder why nothing happens.
auto.create.topics.enable=false

############################# Consumer groups #############################
# Kafka's safe default waits 3s before the first rebalance so that a fleet of
# consumers starting together joins as ONE group instead of several. We start a
# single worker, and that 3s is pure latency on every test run and every
# `npm run worker`.
group.initial.rebalance.delay.ms=0

############################# Retention #############################
# Broker-wide default; per-topic values come from TOPIC_DEFINITIONS
# (domain topics 7 days, dead-letter topic 30 days).
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=60000
